apiVersion: apps/v1
kind: Deployment
metadata:
  name: orflow-api
  # No namespace here — supplied at apply time via -n flag or Jenkins pipeline
  labels:
    app:        orflow-api
    managed-by: kubectl
spec:
  replicas: 1   

  selector:
    matchLabels:
      app: orflow-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   
      maxSurge: 1        

  template:
    metadata:
      labels:
        app: orflow-api
    spec:
      containers:
        - name: orflow-api
          image: orflow-api:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000
              protocol: TCP

          # Environment variables injected from ConfigMap

          envFrom:
            - configMapRef:
                name: orflow-config   

          # Resource requests and limits

          resources:
            requests:
              cpu:    "100m"
              memory: "64Mi"
            limits:
              cpu:    "250m"
              memory: "128Mi"

          # Liveness probe

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10   
            periodSeconds:       15
            failureThreshold:    3   

          # Readiness probe

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds:       10
            failureThreshold:    2